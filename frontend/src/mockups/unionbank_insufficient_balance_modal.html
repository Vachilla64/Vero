<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insufficient Balance Modal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; min-height: 100vh; align-items: center; }
  .app-container { width: 375px; height: 812px; background-color: #f8fafc; position: relative; overflow: hidden; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 8px solid #ffffff; }
  
  .bg-mock { filter: blur(4px); opacity: 0.6; height: 100%; background: #f8fafc; padding-top: 50px;}
  .header-mock { background: linear-gradient(135deg, #00A2E8 0%, #006b99 100%); height: 90px; width: 100%; position: absolute; top:0; z-index: 1; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
  
  .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 10; }
  
  .modal { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-top-left-radius: 32px; border-top-right-radius: 32px; z-index: 20; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
  
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  .modal-indicator { width: 40px; height: 5px; background: #e2e8f0; border-radius: 4px; margin-bottom: 24px; }

  .modal-title { font-size: 18px; font-weight: 600; color: #0f172a; margin-bottom: 32px; text-align: center; width: 100%; }
  
  .icon-circle { width: 80px; height: 80px; background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 40px; font-weight: 700; margin-bottom: 24px; box-shadow: 0 12px 24px rgba(239, 68, 68, 0.25); position: relative; }
  
  .icon-circle::after { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); z-index: -1; }

  .warning-text { font-size: 16px; color: #475569; text-align: center; line-height: 1.6; margin-bottom: 36px; width: 85%; font-weight: 500; }
  
  .close-btn { width: 100%; background: linear-gradient(135deg, #00A2E8 0%, #007BB5 100%); color: white; border: none; border-radius: 16px; padding: 18px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 8px 24px rgba(0, 162, 232, 0.3); }
  .close-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0, 162, 232, 0.4); }
</style>
</head>
<body>
<div class="app-container">
  <div class="header-mock"></div>
  <div class="bg-mock"></div>
  <div class="overlay"></div>
  
  <div class="modal">
    <div class="modal-indicator"></div>
    <div class="modal-title">UnionMobile</div>
    <div class="icon-circle">!</div>
    <div class="warning-text">Your account balance is too low to complete this transaction.</div>
    <button class="close-btn">Dismiss</button>
  </div>
</div>
</body>
</html>
