<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opay - Amount & Remark Input</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8F9FA;
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            background-color: #F8F9FA;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 20px 16px;
            background-color: #F8F9FA;
        }

        .back-btn {
            font-size: 20px;
            color: #333;
            text-decoration: none;
            margin-right: 16px;
            font-weight: 400;
        }

        .header-title {
            font-size: 18px;
            font-weight: 500;
        }

        /* Beneficiary Card */
        .beneficiary-info {
            display: flex;
            align-items: center;
            padding: 0 16px 20px 16px;
            gap: 12px;
        }

        .bank-logo {
            width: 48px;
            height: 48px;
            background-color: #D32F2F;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            font-style: italic;
            position: relative;
        }

        .bank-logo::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 18px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 8px solid white;
        }

        .beneficiary-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .beneficiary-name {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        .beneficiary-account {
            font-size: 14px;
            color: #757575;
        }

        /* Main Content Cards */
        .content {
            padding: 0 16px;
            flex: 1;
        }

        .card {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }

        /* Amount Section */
        .amount-section {
            position: relative;
            margin-bottom: 24px;
        }

        .tooltip {
            position: absolute;
            top: -24px;
            left: 36px;
            background-color: #757575;
            color: white;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 4px 4px 0;
            border-style: solid;
            border-color: #757575 transparent transparent transparent;
        }

        .amount-input-container {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #EEEEEE;
            padding-bottom: 8px;
        }

        .currency {
            font-size: 28px;
            font-weight: 600;
            margin-right: 8px;
            color: #1A1A1A;
        }

        .amount-input {
            font-size: 36px;
            font-weight: 600;
            border: none;
            outline: none;
            width: 100%;
            color: #1A1A1A;
            font-family: inherit;
        }

        .clear-btn {
            width: 20px;
            height: 20px;
            background-color: #E0E0E0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .preset-btn {
            background-color: #F5F5F5;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 500;
            color: #424242;
            cursor: pointer;
        }

        /* Remark Section */
        .remark-input-container {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #EEEEEE;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .remark-input {
            font-size: 16px;
            border: none;
            outline: none;
            width: 100%;
            font-family: inherit;
            color: #333;
        }

        .remark-input::placeholder {
            color: #BDBDBD;
        }

        .remark-tags {
            display: flex;
            gap: 12px;
        }

        .tag-btn {
            background-color: #F5F5F5;
            border: none;
            border-radius: 20px;
            padding: 8px 24px;
            font-size: 14px;
            color: #424242;
            cursor: pointer;
        }

        /* Footer */
        .footer {
            padding: 20px 16px;
            background-color: #F8F9FA;
            margin-top: auto;
        }

        .confirm-btn {
            width: 100%;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

    
        /* Aesthetic Upgrades */
        :root {
            --primary-green: #00D09E;
            --primary-green-dark: #00A37A;
            --primary-gradient: linear-gradient(135deg, #00D09E 0%, var(--primary-green) 100%);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-green: 0 8px 20px rgba(0, 208, 158, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #F4F6F8;
        }

        .app-container {
            box-shadow: 0 24px 48px rgba(0,0,0,0.1) !important;
        }

        button, .tab, .recent-item, .pm-option, .add-card-btn, .preset-btn, .tag-btn {
            transition: var(--transition);
            cursor: pointer;
        }
        
        button:hover:not(:disabled):not(.pay-btn[disabled]) {
            transform: translateY(-2px);
        }
        
        button:active:not(:disabled):not(.pay-btn[disabled]) {
            transform: translateY(0);
        }

        input {
            transition: var(--transition);
        }
        
        input:focus {
            border-bottom-color: var(--primary-green) !important;
            box-shadow: 0 1px 0 var(--primary-green) !important;
        }
        
        .next-btn, .claim-btn, .btn-continue, .confirm-btn {
            background: var(--primary-gradient) !important;
            box-shadow: var(--shadow-green) !important;
        }
        
        .next-btn:hover, .claim-btn:hover, .btn-continue:hover, .confirm-btn:hover {
            box-shadow: 0 12px 24px rgba(0, 208, 158, 0.4) !important;
        }
        
        .overlay {
            background-color: rgba(15, 23, 42, 0.4) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal {
            box-shadow: 0 -8px 32px rgba(0,0,0,0.15) !important;
            border-top: 1px solid rgba(255,255,255,0.8);
        }

        .form-section, .card, .success-rate, .pm-options, .details-card {
            box-shadow: var(--shadow-md) !important;
            border: 1px solid rgba(255,255,255,0.9) !important;
            background: rgba(255,255,255,0.8) !important;
            backdrop-filter: blur(20px);
        }
        
        .tab:hover {
            color: var(--primary-green);
        }
        
        .preset-btn:hover, .tag-btn:hover {
            background-color: #E8F5E9 !important;
            color: var(--primary-green-dark) !important;
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        
        .pay-btn {
            transition: var(--transition);
        }
        
        /* Specific override for enabled pay button as per mockup */
        .pay-btn:not([style*="background-color: #B2DFDB"]):not([disabled]) {
            background: var(--primary-gradient) !important;
            box-shadow: var(--shadow-green) !important;
        }
        
        .pay-btn:not([style*="background-color: #B2DFDB"]):not([disabled]):hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 208, 158, 0.4) !important;
        }
        
        .radio-outer {
            transition: var(--transition);
        }
        .pm-option:hover .radio-outer:not(.selected) {
            border-color: #00D09E;
        }
        
        .recent-item:hover, .pm-option:hover {
            background-color: #F8FAFC;
            border-radius: 8px;
        }

    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <a href="#" class="back-btn" style="display:flex; align-items:center; text-decoration:none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
            <span class="header-title">Transfer to Bank Account</span>
        </div>

        <!-- Beneficiary Info -->
        <div class="beneficiary-info">
            <div class="bank-logo">UBA</div>
            <div class="beneficiary-details">
                <span class="beneficiary-name">VALENTINE CHINEDU ALFRED</span>
                <span class="beneficiary-account">2279612300 United Bank For Africa</span>
            </div>
        </div>

        <div class="content">
            <!-- Amount Card -->
            <div class="card">
                <div class="card-title">Amount</div>
                
                <div class="amount-section">
                    <div class="tooltip">Tens of Thousands</div>
                    <div class="amount-input-container">
                        <span class="currency">₦</span>
                        <input type="text" class="amount-input" value="50,000.00">
                        <div class="clear-btn" style="background:transparent; color:#9e9e9e;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
                    </div>
                </div>

                <div class="preset-grid">
                    <button class="preset-btn">₦500</button>
                    <button class="preset-btn">₦1,000</button>
                    <button class="preset-btn">₦2,000</button>
                    <button class="preset-btn">₦5,000</button>
                    <button class="preset-btn">₦9,999</button>
                    <button class="preset-btn">₦10,000</button>
                </div>
            </div>

            <!-- Remark Card -->
            <div class="card">
                <div class="card-title">Remark</div>
                
                <div class="remark-input-container">
                    <input type="text" class="remark-input" value="Eye glasses">
                    <div class="clear-btn" style="background:transparent; color:#9e9e9e;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
                </div>

                <div class="remark-tags">
                    <button class="tag-btn">Purchase</button>
                    <button class="tag-btn">Personal</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <button class="confirm-btn">Confirm</button>
        </div>
    </div>
</body>
</html>
